name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The version number is the commit count, so a shallow clone would build 0.1.1
          # forever and no installed copy would ever see a newer version.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: ./gradlew test jar

      # This box has no screen either. The screenshots are how a change gets looked at.
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/*.png

      # Conveyor cross-builds Windows and Linux packages here on Linux, signs them with
      # the root key, and replaces the GitHub release the installed apps update from.
      - uses: hydraulic-software/conveyor/actions/build@v22.2
        with:
          command: make copied-site
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1
          extra_flags: -Kapp.site.github.oauth-token=${{ secrets.GITHUB_TOKEN }}

      # Conveyor publishes the release as a list of files and nothing else, and the file
      # that looks most like the thing to click is the .msix. Double-clicking it opens
      # Windows' App Installer, which cannot install a package whose signer it does not
      # trust yet, and whose Cancel button then does nothing. So the notes say what to run
      # instead. The version is the commit count, the same as build.gradle.kts computes it.
      - name: Say how to install it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "0.1.$(git rev-list --count HEAD)" --notes-file docs/release-notes.md
