name: Build

# Every push is checked. Only a deliberate run publishes one.
#
# It used to release on every push, which meant a version number for every commit and an
# installed copy being asked to restart for a one line change. Packaging and uploading a
# release is also the slowest and least reliable part of this: three of five in one morning
# died halfway through uploading to GitHub, with nothing wrong with the code. So the two are
# split. The version is still the commit count, so it keeps climbing whether or not a given
# commit was released, and a released one is simply the count at the moment it went out.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Package and publish a release, not just run the tests
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The version number is the commit count, so a shallow clone would build 0.1.1
          # forever and no installed copy would ever see a newer version.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: ./gradlew test jar

      # This box has no screen either. The screenshots are how a change gets looked at.
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/*.png

      # Conveyor cross-builds Windows and Linux packages here on Linux, signs them with
      # the root key, and replaces the GitHub release the installed apps update from.
      - uses: hydraulic-software/conveyor/actions/build@v22.2
        if: inputs.release
        with:
          command: make copied-site
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1
          extra_flags: -Kapp.site.github.oauth-token=${{ secrets.GITHUB_TOKEN }}

      # Conveyor publishes the release as a list of files and nothing else, and the file
      # that looks most like the thing to click is the .msix. Double-clicking it opens
      # Windows' App Installer, which cannot install a package whose signer it does not
      # trust yet, and whose Cancel button then does nothing. So the notes say what to run
      # instead. The version is the commit count, the same as build.gradle.kts computes it.
      # Published over the one Conveyor generates, which has no
      # -ForceTargetApplicationShutdown and so cannot install while Rampart is running.
      # Re-running the install line to update is the commonest way to hit that.
      - name: Replace the installer with ours
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "0.1.$(git rev-list --count HEAD)" deploy/install.ps1 --clobber

      - name: Say how to install it
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "0.1.$(git rev-list --count HEAD)" --notes-file docs/release-notes.md
