name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: ./gradlew test
      # The screenshots are how this app gets looked at: the build box has no screen and
      # neither does anyone reviewing a change.
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/*.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # A folder you unzip and run, so a first look needs no installer and no
      # SmartScreen argument. The MSI is the same build with an installer wrapped round it.
      - run: ./gradlew createDistributable
      - uses: actions/upload-artifact@v4
        with:
          name: Rampart-windows
          path: build/compose/binaries/main/app/Rampart
      # jpackage needs WiX for an MSI and the runner image does not always carry it.
      # A missing installer must not cost us the build above.
      - run: ./gradlew packageMsi
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rampart-msi
          path: build/compose/binaries/main/msi/*.msi
          if-no-files-found: ignore
