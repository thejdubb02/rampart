server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 512;

    # The page changes when a release does; the screenshots change less often than that.
    location = /index.html { add_header Cache-Control "public, max-age=300"; }
    location /img/        { add_header Cache-Control "public, max-age=86400"; }

    location = /health { access_log off; return 200 "ok\n"; }

    location / { try_files $uri $uri/ =404; }
}
