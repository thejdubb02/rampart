// Packaging is Hydraulic Conveyor's job. It cross-builds the Windows package from this
// Linux box, so there is no Windows machine anywhere in the chain, and it makes the
// result self-updating: Windows keeps an MSIX current in the background whether or not
// the app is running. See docs/architecture.md.
include required("#!./gradlew -q printConveyorConfig")

app {
  display-name = Rampart
  fsname = rampart
  rdns-name = io.github.thejdubb02.rampart

  // Points the update feed at this repository's latest GitHub release. Nothing to host.
  vcs-url = "github.com/thejdubb02/rampart"

  icons = "branding/Rampart_Icon_App.svg"
  license = Apache-2.0

  // macOS needs a paid Apple account to notarise, and an unnotarised build is worse than
  // none. Windows first, Linux next, per docs/architecture.md.
  machines = [ windows.amd64, linux.amd64.glibc ]

  windows.manifests.msix.background-color = "#ffffff"

  // Deliberately NOT aggressive. Aggressive makes the launcher check, and wait, before the
  // window appears, so every start pays for a network round trip. Rampart asks GitHub
  // itself once it is already on screen and offers a restart, which puts the pause where
  // someone chose it rather than in front of their mail.
  updates = background
}

conveyor.compatibility-level = 23
